[package]
name = "pet-agent"
version = "0.1.0"
edition = "2021"
description = "AI bridge: user text -> AI provider -> DesktopPet via named pipe"

[dependencies]
pet-protocol = { path = "../pet-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_IO",
] }
